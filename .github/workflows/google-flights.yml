name: Actualización de frecuencias futuras (Google Flights)

on:
  schedule:
    # Todos los lunes a las 11:00 UTC. Los horarios/frecuencias de vuelos
    # cambian poco de un día a otro (a diferencia del precio), así que no
    # hace falta el cron diario del scraper de tarifas.
    - cron: "0 11 * * 1"
  workflow_dispatch: {} # permite dispararlo a mano desde Actions

jobs:
  actualizar-google-flights:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Escribir credenciales de Google
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDENTIALS" > credenciales-google.json

      - name: Correr relevamiento de Google Flights
        run: node google_flights.js

      - name: Limpiar credenciales
        if: always()
        run: rm -f credenciales-google.json

      - name: Commitear cambios locales (si los hay)
        run: |
          git config user.name "fare-tracker-internacional-bot"
          git config user.email "actions@github.com"
          git diff --quiet --cached || git commit -m "Google Flights: frecuencias futuras actualizadas $(date -u +%Y-%m-%d)"
          git push || true

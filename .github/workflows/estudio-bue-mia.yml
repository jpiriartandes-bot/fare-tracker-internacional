name: Estudio BUE-MIA

on:
  schedule:
    # Diario a las 10:00 UTC. Los 3 estudios van escalonados (06:00, 08:00 y
    # 10:00 UTC) para no pisarse; cada uno escribe solo su hoja y su CSV.
    - cron: "0 10 * * *"
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña "Actions"

jobs:
  estudio:
    name: estudio bue-mia
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: write

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Escribir credenciales de Google
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDENTIALS" > credenciales-google.json

      - name: Correr estudio bue-mia
        run: node estudio.js --estudio=bue-mia

      - name: Limpiar credenciales
        if: always()
        run: rm -f credenciales-google.json

      - name: Commitear CSV del estudio
        # always(): si el estudio se cortó a mitad, igual se guarda lo que
        # alcanzó a escribir. Toca solo su CSV, así que el rebase no tiene
        # conflictos; el reintento cubre que otro workflow pushee justo
        # entre el pull y el push.
        if: always()
        run: |
          git config user.name "fare-tracker-internacional-bot"
          git config user.email "actions@github.com"
          CSV=output/estudio_bue_mia.csv
          [ -f "$CSV" ] || { echo "No hay $CSV, nada para commitear."; exit 0; }
          git add "$CSV"
          git diff --quiet --cached && { echo "Sin cambios."; exit 0; }
          git commit -m "Estudio BUE-MIA: relevamiento $(date -u +%Y-%m-%d)"
          for intento in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push rechazado (intento $intento), reintentando..."
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 10))
          done
          exit 1

name: Estudio EZE-CCS

on:
  # Disparo principal: el Apps Script de la planilla "Fare Tracker
  # Internacional" lanza los 3 estudios con workflow_dispatch a las 05:00 ARG.
  # El cron es solo respaldo (GitHub demora los schedule varias horas): los 3
  # escalonados 10:17 / 10:37 / 10:57 UTC, en minutos raros para no caer en la
  # hora en punto, que es la más congestionada. Si ese día ya corrió, el job
  # "chequeo" lo descarta.
  schedule:
    - cron: "37 10 * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Correr aunque el CSV ya tenga filas de hoy"
        type: boolean
        default: false

# Un solo eze-ccs a la vez: si el respaldo cae mientras corre el del Apps
# Script, queda en cola y al arrancar el chequeo ve las filas de hoy.
concurrency:
  group: estudio-eze-ccs
  cancel-in-progress: false

jobs:
  chequeo:
    name: ¿ya corrió hoy?
    runs-on: ubuntu-24.04
    outputs:
      correr: ${{ steps.chequeo.outputs.correr }}
    steps:
      - name: Checkout del CSV
        # ref: main y no el SHA del evento: si esta corrida quedó en cola por
        # concurrency, el SHA es el de cuando se encoló y el CSV no tendría
        # las filas que commiteó la corrida anterior.
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: output/estudio_eze_ccs.csv
          sparse-checkout-cone-mode: false

      - name: ¿Hay filas con la fecha de hoy?
        id: chequeo
        env:
          FORZAR: ${{ inputs.forzar }}
        run: |
          CSV=output/estudio_eze_ccs.csv
          HOY=$(date -u +%Y-%m-%d) # fecha_busqueda se escribe en UTC
          if [ "$FORZAR" = "true" ]; then
            echo "Corrida forzada a mano."
            echo "correr=true" >> "$GITHUB_OUTPUT"
          elif [ -f "$CSV" ] && grep -q "^$HOY," "$CSV"; then
            echo "::notice::$CSV ya tiene filas de $HOY: no se corre de nuevo."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          else
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

  estudio:
    needs: chequeo
    if: needs.chequeo.outputs.correr == 'true'
    name: estudio eze-ccs
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    permissions:
      contents: write

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Instalar Xvfb
        # Avianca y Gol bloquean/fallan en headless real (Akamai detecta
        # "HeadlessChrome"; Gol ni carga el formulario): sus scrapers fuerzan
        # headless:false y en un runner sin display hace falta un framebuffer.
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Escribir credenciales de Google
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDENTIALS" > credenciales-google.json

      - name: Correr estudio eze-ccs
        run: xvfb-run -a node estudio.js --estudio=eze-ccs

      - name: Limpiar credenciales
        if: always()
        run: rm -f credenciales-google.json

      - name: Commitear CSV del estudio
        # always(): si el estudio se cortó a mitad, igual se guarda lo que
        # alcanzó a escribir. Toca solo su CSV, así que el rebase no tiene
        # conflictos; el reintento cubre que otro workflow pushee justo
        # entre el pull y el push.
        if: always()
        run: |
          git config user.name "fare-tracker-internacional-bot"
          git config user.email "actions@github.com"
          CSV=output/estudio_eze_ccs.csv
          [ -f "$CSV" ] || { echo "No hay $CSV, nada para commitear."; exit 0; }
          git add "$CSV"
          git diff --quiet --cached && { echo "Sin cambios."; exit 0; }
          git commit -m "Estudio EZE-CCS: relevamiento $(date -u +%Y-%m-%d)"
          for intento in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push rechazado (intento $intento), reintentando..."
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 10))
          done
          exit 1

name: Actualización de frecuencias ANAC

on:
  schedule:
    # Día 5 de cada mes a las 10:00 UTC (mismo horario que el fare-tracker
    # doméstico, da margen a que ANAC publique el mes anterior)
    - cron: "0 10 5 * *"
  workflow_dispatch: {} # permite dispararlo a mano desde Actions

jobs:
  actualizar-frecuencias:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Escribir credenciales de Google
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDENTIALS" > credenciales-google.json

      - name: Correr actualización de frecuencias
        run: node frecuencias.js

      - name: Limpiar credenciales
        if: always()
        run: rm -f credenciales-google.json

      - name: Commitear cambios locales (si los hay)
        run: |
          git config user.name "fare-tracker-internacional-bot"
          git config user.email "actions@github.com"
          git diff --quiet --cached || git commit -m "Frecuencias ANAC actualizadas $(date -u +%Y-%m-%d)"
          git push || true

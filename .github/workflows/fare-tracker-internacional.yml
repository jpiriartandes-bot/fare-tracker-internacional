name: Relevamiento de tarifas internacionales

on:
  schedule:
    # Corre todos los días a las 13:00 UTC. Ajustar horario/frecuencia a gusto
    # (elegido para no coincidir con el cron del fare-tracker doméstico).
    - cron: "0 13 * * *"
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña "Actions" de GitHub

jobs:
  relevar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Escribir credenciales de Google
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDENTIALS" > credenciales-google.json

      - name: Correr relevamiento
        run: npm start

      - name: Limpiar credenciales
        if: always()
        run: rm -f credenciales-google.json

      - name: Commitear historico.csv actualizado
        run: |
          git config user.name "fare-tracker-internacional-bot"
          git config user.email "actions@github.com"
          git add output/historico.csv
          git diff --quiet --cached || git commit -m "Relevamiento automático $(date -u +%Y-%m-%d)"
          git push
